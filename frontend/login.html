
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Login - DHEJA MART</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <h1>DHEJA MART</h1>
        <h2>Buyer Login</h2>

        <input
            type="text"
            id="buyerUsername"
            placeholder="Enter Username"
        >

        <input
            type="password"
            id="buyerPassword"
            placeholder="Enter Password"
        >

        <button onclick="buyerLogin()">Login</button>

        <p id="buyerMessage"></p>

        <p>
            New to DHEJA MART?
            <a href="register.html">Create Account</a>
        </p>

        <br>

        <a href="index.html">⬅ Back to Home</a>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
